<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مواقيت الصلاة</title>
    <meta name="theme-color" content="#0d1321">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-1024.png">
    <link rel="apple-touch-icon" href="icon-1024.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1321;
            --card-color: rgba(27, 38, 59, 0.6);
            --text-color: #ffffff; 
            --primary-color: #E1C56E;
            --accent-color: #E1C56E;
            --sub-text: #ffffff; 
            --border-color: rgba(255, 255, 255, 0.08);
            --modal-bg: #1b263b;
            --sun-color: #f1c40f; 
        }

        [data-theme="light"] {
            --bg-color: #f0f4f8;
            --card-color: rgba(255, 255, 255, 0.9);
            --text-color: #2d3436;
            --primary-color: #2c3e50;
            --accent-color: #c0392b;
            --sub-text: #2d3436; 
            --border-color: rgba(0, 0, 0, 0.05);
            --modal-bg: #ffffff;
            --sun-color: #f1c40f;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none !important;
            box-sizing: border-box;
            /* إزالة أي انتقال تدريجي ليكون التغيير لحظياً */
            transition: none !important;
        }

        html, body { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--bg-color); 
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        #theme-toggle {
            position: absolute;
            top: 25px;
            left: 20px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 2000;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sun-icon { color: var(--sun-color); width: 100%; height: 100%; fill: currentColor; }
        .moon-icon { color: #ffffff; width: 100%; height: 100%; fill: currentColor; }

        [data-theme="dark"] .sun-icon { display: none; }
        [data-theme="dark"] .moon-icon { display: block; }
        [data-theme="light"] .sun-icon { display: block; }
        [data-theme="light"] .moon-icon { display: none; }

        .container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            padding-top: 15px; 
            padding-bottom: 25px;
        }

        @media (display-mode: standalone) {
            .container { padding-top: 0.8cm !important; }
        }

        header { margin-bottom: 15px; }

        .sub-title { 
            font-size: 0.95rem; 
            color: var(--sub-text); 
            margin: 0; 
            font-weight: 400; 
            opacity: 0.9; 
        }

        .city-name { 
            font-size: 2.1rem; margin: 15px 0;
            color: var(--accent-color); 
            font-weight: 700; cursor: pointer; display: block; line-height: 1.1;
        }

        #current-date-header {
            color: var(--text-color); 
            font-size: 1rem; 
            margin: 0 0 15px 0; 
            cursor: pointer; 
            min-height: 1.2em; 
            opacity: 0.9; 
        }

        .prayer-times-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex-shrink: 0; }

        .prayer-card {
            background: var(--card-color); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 15px; border-radius: 16px; border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .prayer-card h2 { margin: 0 0 8px; font-size: 0.95rem; color: var(--primary-color); font-weight: 600; pointer-events: none; }
        .prayer-card p { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--text-color); pointer-events: none; }

        .next-prayer-highlight { 
            border: 2px solid var(--accent-color) !important; 
            z-index: 5;
        }

        .countdown-card { grid-column: 1 / -1; margin-top: 8px; align-content: center; min-height: 90px; cursor: default; }
        .countdown-card p { color: var(--text-color); }
        .gold-num { color: var(--accent-color); font-weight: 800; }

        .navigation-controls { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 1rem; }

        .nav-arrow {
            background: var(--card-color); border: 1px solid var(--border-color);
            color: var(--primary-color); border-radius: 50%; width: 60px; height: 60px;
            font-size: 1.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center;
            padding-bottom: 5px;
        }

        .nav-arrow:active {
            border-color: var(--accent-color) !important;
            color: var(--accent-color) !important;
            transform: scale(0.95);
        }

        .nav-arrow:disabled { opacity: 0.2; cursor: not-allowed; transform: none; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: flex-start;
            padding-top: 15vh; z-index: 1000;
        }
        .modal-content {
            background: var(--modal-bg); border: 1px solid var(--border-color);
            padding: 30px 25px; border-radius: 28px; text-align: center;
            width: fit-content; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            pointer-events: auto;
        }

        .city-selection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .city-btn {
            background: rgba(127, 127, 127, 0.05); color: var(--text-color); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 12px 5px; cursor: pointer; font-family: 'Cairo';
            font-size: 0.85rem; font-weight: 600;
        }

        .date-inputs-row { display: flex; gap: 10px; direction: rtl; }
        .date-segment-input { 
            width: 70px; padding: 12px 0; border-radius: 12px; border: 1px solid var(--border-color); 
            background: rgba(0, 0, 0, 0.1); color: var(--text-color); text-align: center; font-family: 'Cairo';
            font-size: 1rem;
        }

        #go-to-date-btn { 
            background: var(--primary-color); color: var(--bg-color); border: none; 
            padding: 12px 0; width: 100%; border-radius: 12px; font-weight: 700; 
            cursor: pointer; font-size: 1rem;
        }
    </style>
</head>
<body>

    <button id="theme-toggle" aria-label="تبديل المظهر">
        <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-12.37a.996.996 0 00-1.41-1.41l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zm-12.37 12.37a.996.996 0 00-1.41 1.41l1.06-1.06c.39-.39.39-1.03 0-1.41a.996.996 0 00-1.41 0l-1.06 1.06z"></path></svg>
        <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 6.2 6.2 0 0 0 21 12.79z"></path></svg>
    </button>

    <div id="city-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 360px; width: 92%;">
            <h2 style="color:var(--primary-color); margin: 0;">اختر المحافظة</h2>
            <div id="city-selection" class="city-selection-grid">
                <button class="city-btn" data-city="amman" data-name="عمّان">عمّان</button>
                <button class="city-btn" data-city="zarqa" data-name="الزرقاء">الزرقاء</button>
                <button class="city-btn" data-city="balqa" data-name="البلقاء">البلقاء</button>
                <button class="city-btn" data-city="madaba" data-name="مادبا">مادبا</button>
                <button class="city-btn" data-city="irbid" data-name="إربد">إربد</button>
                <button class="city-btn" data-city="mafraq" data-name="المفرق">المفرق</button>
                <button class="city-btn" data-city="ajloun" data-name="عجلون">عجلون</button>
                <button class="city-btn" data-city="jerash" data-name="جرش">جرش</button>
                <button class="city-btn" data-city="karak" data-name="الكرك">الكرك</button>
                <button class="city-btn" data-city="tafilah" data-name="الطفيلة">الطفيلة</button>
                <button class="city-btn" data-city="ma'an" data-name="معان">معان</button>
                <button class="city-btn" data-city="aqaba" data-name="العقبة">العقبة</button>
            </div>
        </div>
    </div>

    <div id="date-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color:var(--primary-color); margin: 0;">اذهب إلى تاريخ</h2>
            <div style="display: inline-flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px;">
                <div class="date-inputs-row">
                    <input type="number" id="day-input" class="date-segment-input" placeholder="يوم">
                    <input type="number" id="month-input" class="date-segment-input" placeholder="شهر">
                    <input type="number" id="year-input" class="date-segment-input" value="2026">
                </div>
                <button id="go-to-date-btn">تأكيد الانتقال</button>
            </div>
            <p id="date-error-msg" style="color:#ff6b6b; font-size:0.75rem; margin: 10px 0 0 0; min-height: 1em;"></p>
        </div>
    </div>

    <div class="container">
        <header>
            <p class="sub-title">مواقيت الصلاة في</p>
            <h1 id="city-header" class="city-name">--</h1>
            <p id="current-date-header">تحميل البيانات...</p>
        </header>

        <div class="prayer-times-grid">
            <div class="prayer-card" id="imsak-card" data-key="IMSAK"><h2>الإمساك</h2><p id="imsak-time">--:--</p></div>
            <div class="prayer-card" id="fajr-card" data-key="FAJR"><h2>الفجر</h2><p id="fajr-time">--:--</p></div>
            <div class="prayer-card" id="dhuhr-card" data-key="DHUHR"><h2>الظهر</h2><p id="dhuhr-time">--:--</p></div>
            <div class="prayer-card" id="asr-card" data-key="ASR"><h2>العصر</h2><p id="asr-time">--:--</p></div>
            <div class="prayer-card" id="maghrib-card" data-key="MAGHRIB"><h2>المغرب</h2><p id="maghrib-time">--:--</p></div>
            <div class="prayer-card" id="isha-card" data-key="ISHA"><h2>العشاء</h2><p id="isha-time">--:--</p></div>
            <div class="prayer-card countdown-card">
                <h2 id="countdown-title">الوقت المتبقي</h2>
                <p id="countdown-timer">--:--:--</p>
            </div>
        </div>

        <div class="navigation-controls">
            <button id="prev-day-btn" class="nav-arrow">&lt;</button>
            <button id="next-day-btn" class="nav-arrow">&gt;</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(err => console.log('SW registration failed:', err));
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const savedTheme = localStorage.getItem('theme') || 'dark';

            function setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                const themeColor = theme === 'light' ? '#f0f4f8' : '#0d1321';
                const metaTheme = document.querySelector('meta[name="theme-color"]');
                if (metaTheme) metaTheme.setAttribute('content', themeColor);
            }

            setTheme(savedTheme);

            themeToggle.addEventListener('click', () => {
                const current = document.documentElement.getAttribute('data-theme');
                setTheme(current === 'dark' ? 'light' : 'dark');
            });

            const cityModal = document.getElementById('city-modal');
            const dateModal = document.getElementById('date-modal');
            const dayInput = document.getElementById('day-input');
            const monthInput = document.getElementById('month-input');
            const yearInput = document.getElementById('year-input');
            const goToDateBtn = document.getElementById('go-to-date-btn');
            const dateErrorMsg = document.getElementById('date-error-msg');
            const cityHeader = document.getElementById('city-header');

            let prayerData = null;
            let displayedDate = new Date();
            const prayerNames = {IMSAK: 'الإمساك', FAJR:'الفجر', DHUHR:'الظهر', ASR:'العصر', MAGHRIB:'المغرب', ISHA:'العشاء'};
            let countdownInterval = null;
            let manualSelectedPrayerKey = null;

            const elements = {
                imsakTime: document.getElementById('imsak-time'),
                fajrTime: document.getElementById('fajr-time'), 
                dhuhrTime: document.getElementById('dhuhr-time'), 
                asrTime: document.getElementById('asr-time'),
                maghribTime: document.getElementById('maghrib-time'), 
                ishaTime: document.getElementById('isha-time'),
                nextDayBtn: document.getElementById('next-day-btn'), 
                prevDayBtn: document.getElementById('prev-day-btn'),
                currentDateHeader: document.getElementById('current-date-header'),
                countdownTitle: document.getElementById('countdown-title'), 
                countdownTimer: document.getElementById('countdown-timer')
            };

            [cityModal, dateModal].forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) {
                        if (modal === cityModal && !localStorage.getItem('selectedCityId')) return;
                        modal.style.display = 'none';
                    }
                });
            });

            document.querySelectorAll('.prayer-card[data-key]').forEach(card => {
                card.addEventListener('click', function() {
                    document.querySelectorAll('.prayer-card').forEach(c => c.classList.remove('next-prayer-highlight'));
                    this.classList.add('next-prayer-highlight');
                    manualSelectedPrayerKey = this.getAttribute('data-key');
                    updateUIForDate(displayedDate);
                });
            });

            function formatAr(num, sing, dual, plur) {
                const numSpan = `<span class="gold-num">${num}</span>`;
                if (num === 1) return sing;
                if (num === 2) return dual;
                if (num >= 3 && num <= 10) return `${numSpan} ${plur}`;
                return `${numSpan} ${sing}`;
            }

            function formatCountdownText(h, m, s) {
                let hT = h > 0 ? formatAr(h, "ساعة", "ساعتان", "ساعات") : "";
                let mT = m > 0 ? formatAr(m, "دقيقة", "دقيقتان", "دقائق") : "";
                let sT = (h === 0 && m < 5) ? formatAr(s, "ثانية", "ثانيتان", "ثوانٍ") : "";
                let parts = [];
                if(hT) parts.push(hT);
                if(mT) parts.push(mT);
                if(sT) parts.push(sT);
                if (parts.length === 0) return "ثوانٍ معدودة";
                if (parts.length === 1) return parts[0];
                if (parts.length === 2) return `${parts[0]} و ${parts[1]}`;
                return `${parts[0]} و ${parts[1]} و ${parts[2]}`;
            }

            async function fetchAndParsePrayerData(cityId) {
                const url = `https://iofahmawi.github.io/salat/governorates/${cityId}-2026.csv`;
                try {
                    const response = await fetch(url);
                    const csvText = await response.text();
                    const lines = csvText.trim().split('\n').slice(1);
                    const dataMap = new Map();
                    lines.forEach(line => {
                        const parts = line.split(',');
                        if (parts.length >= 7) {
                            const [date, fajr, sunrise, dhuhr, asr, maghrib, isha] = parts;
                            dataMap.set(date, { FAJR: fajr, DHUHR: dhuhr, ASR: asr, MAGHRIB: maghrib, ISHA: isha });
                        }
                    });
                    return dataMap;
                } catch (e) { return null; }
            }

            function parseTimeTo24Hour(timeStr, prayerKey) {
                let [hours, minutes] = timeStr.split(':').map(Number);
                if (['DHUHR', 'ASR', 'MAGHRIB', 'ISHA'].includes(prayerKey) && hours < 12) hours += 12;
                return { hours, minutes };
            }

            async function initializeCity(cityId, cityName) {
                cityHeader.textContent = cityName;
                prayerData = await fetchAndParsePrayerData(cityId);
                if (prayerData) { 
                    displayedDate = new Date(); 
                    updateUIForDate(displayedDate); 
                }
            }

            function updateUIForDate(date) {
                if (!prayerData) return;
                const dateKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                const dayData = prayerData.get(dateKey);
                if(!dayData) return;

                const dayNameFormatter = new Intl.DateTimeFormat('ar-SA', { weekday: 'long' });
                const dayName = dayNameFormatter.format(date);

                let hijriDate = new Date(date);
                hijriDate.setDate(hijriDate.getDate() - 1); 

                const hijriInfoFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
                
                let formattedHijri = hijriInfoFormatter.format(hijriDate).replace(/[هـ]/g, '').trim();
                elements.currentDateHeader.textContent = `${dayName}، ${formattedHijri}`;

                const fInfo = parseTimeTo24Hour(dayData['FAJR'], 'FAJR');
                const imsakDateObj = new Date(new Date(2026, 0, 1, fInfo.hours, fInfo.minutes).getTime() - (15 * 60000));
                elements.imsakTime.textContent = `${imsakDateObj.getHours() % 12 || 12}:${String(imsakDateObj.getMinutes()).padStart(2, '0')} ص`;

                ['FAJR', 'DHUHR', 'ASR', 'MAGHRIB', 'ISHA'].forEach(key => {
                    const { hours, minutes } = parseTimeTo24Hour(dayData[key], key);
                    const suffix = (key === 'FAJR') ? 'ص' : 'م';
                    elements[`${key.toLowerCase()}Time`].textContent = `${hours % 12 || 12}:${String(minutes).padStart(2, '0')} ${suffix}`;
                });

                startCountdown(date);
                updateNavigation(date);
            }

            function startCountdown(date) {
                if (countdownInterval) clearInterval(countdownInterval);
                const isToday = date.toDateString() === new Date().toDateString();

                if (!isToday) {
                    elements.countdownTitle.textContent = "الوقت المتبقي";
                    elements.countdownTimer.innerHTML = `<span style="font-size: 1.25rem; font-weight: 700;">غير متوفر الآن</span>`;
                    document.querySelectorAll('.prayer-card').forEach(c => c.classList.remove('next-prayer-highlight'));
                    return;
                }

                const tick = () => {
                    const now = new Date();
                    const dateKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                    const dayData = prayerData.get(dateKey);
                    if(!dayData) return;

                    let targetPrayer = null;

                    if (manualSelectedPrayerKey) {
                        let targetTime;
                        if (manualSelectedPrayerKey === 'IMSAK') {
                            const fInfo = parseTimeTo24Hour(dayData['FAJR'], 'FAJR');
                            targetTime = new Date(date.getFullYear(), date.getMonth(), date.getDate(), fInfo.hours, fInfo.minutes).getTime() - (15 * 60000);
                        } else {
                            const { hours, minutes } = parseTimeTo24Hour(dayData[manualSelectedPrayerKey], manualSelectedPrayerKey);
                            targetTime = new Date(date.getFullYear(), date.getMonth(), date.getDate(), hours, minutes).getTime();
                        }

                        if (now.getTime() > targetTime) {
                            manualSelectedPrayerKey = null; 
                        } else {
                            targetPrayer = { name: prayerNames[manualSelectedPrayerKey], time: targetTime, key: manualSelectedPrayerKey };
                        }
                    }

                    if (!targetPrayer) {
                        const fInfo = parseTimeTo24Hour(dayData['FAJR'], 'FAJR');
                        const imsakTime = new Date(date.getFullYear(), date.getMonth(), date.getDate(), fInfo.hours, fInfo.minutes).getTime() - (15 * 60000);

                        if (now.getTime() < imsakTime && now.getHours() < 12) {
                            targetPrayer = { name: "الإمساك", time: imsakTime, key: 'IMSAK' };
                        } else {
                            for (const key of ['FAJR', 'DHUHR', 'ASR', 'MAGHRIB', 'ISHA']) {
                                const { hours, minutes } = parseTimeTo24Hour(dayData[key], key);
                                const pTime = new Date(date.getFullYear(), date.getMonth(), date.getDate(), hours, minutes).getTime();
                                if (pTime > now.getTime()) { 
                                    targetPrayer = { name: prayerNames[key], time: pTime, key: key }; 
                                    break; 
                                }
                            }
                        }
                    }

                    if (!manualSelectedPrayerKey) {
                        document.querySelectorAll('.prayer-card').forEach(c => c.classList.remove('next-prayer-highlight'));
                    }

                    if (targetPrayer) {
                        const diff = targetPrayer.time - now.getTime();
                        elements.countdownTitle.innerHTML = `<span>متبقي على ${targetPrayer.key === 'IMSAK' ? '' : 'صلاة '}${targetPrayer.name}</span>`;
                        elements.countdownTimer.innerHTML = formatCountdownText(Math.floor(diff/3600000), Math.floor((diff%3600000)/60000), Math.floor((diff%60000)/1000));
                        
                        const targetCard = document.getElementById(`${targetPrayer.key.toLowerCase()}-card`);
                        if (!targetCard.classList.contains('next-prayer-highlight')) {
                            targetCard.classList.add('next-prayer-highlight');
                        }
                    } else {
                        elements.countdownTitle.textContent = "انتهت صلوات اليوم";
                        elements.countdownTimer.innerHTML = `<span style="font-size: 1.25rem; font-weight: 700;">تقبل الله طاعتكم</span>`;
                    }
                };

                tick(); 
                countdownInterval = setInterval(tick, 1000); 
            }

            function updateNavigation(date) {
                if(!prayerData) return;
                const keys = Array.from(prayerData.keys()).sort();
                const currentStr = date.toISOString().split('T')[0];
                elements.prevDayBtn.disabled = currentStr <= keys[0];
                elements.nextDayBtn.disabled = currentStr >= keys[keys.length-1];
            }

            document.getElementById('city-selection').addEventListener('click', e => {
                const btn = e.target.closest('.city-btn');
                if (btn) {
                    localStorage.setItem('selectedCityId', btn.dataset.city);
                    localStorage.setItem('selectedCityName', btn.dataset.name);
                    cityModal.style.display = 'none';
                    initializeCity(btn.dataset.city, btn.dataset.name);
                }
            });

            cityHeader.addEventListener('click', () => cityModal.style.display = 'flex');
            elements.nextDayBtn.addEventListener('click', () => { manualSelectedPrayerKey = null; displayedDate.setDate(displayedDate.getDate() + 1); updateUIForDate(displayedDate); });
            elements.prevDayBtn.addEventListener('click', () => { manualSelectedPrayerKey = null; displayedDate.setDate(displayedDate.getDate() - 1); updateUIForDate(displayedDate); });

            elements.currentDateHeader.addEventListener('click', () => { 
                dayInput.value = displayedDate.getDate(); 
                monthInput.value = displayedDate.getMonth() + 1; 
                dateModal.style.display = 'flex'; 
            });

            goToDateBtn.addEventListener('click', () => {
                const dStr = `${yearInput.value}-${String(monthInput.value).padStart(2,'0')}-${String(dayInput.value).padStart(2,'0')}`;
                if (prayerData && prayerData.has(dStr)) { 
                    manualSelectedPrayerKey = null;
                    displayedDate = new Date(dStr); updateUIForDate(displayedDate); dateModal.style.display = 'none'; dateErrorMsg.textContent = "";
                } else { dateErrorMsg.textContent = "التاريخ غير متوفر"; }
            });

            const savedId = localStorage.getItem('selectedCityId');
            if (savedId) initializeCity(savedId, localStorage.getItem('selectedCityName'));
            else cityModal.style.display = 'flex';
        });
    </script>
</body>
</html>
