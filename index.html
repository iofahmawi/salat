<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مواقيت الصلاة</title>
    <meta name="theme-color" content="#0d1321">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-1024.png">
    <link rel="apple-touch-icon" href="icon-1024.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1321;
            --card-color: rgba(27, 38, 59, 0.6);
            --text-color: #f1f1f1;
            --primary-color: #E1C56E;
            --disabled-color: #4A5568;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            outline: none !important;
            box-sizing: border-box;
        }

        html, body { height: 100%; margin: 0; overflow: hidden; background-color: var(--bg-color); }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            padding-top: 15px; 
            padding-bottom: 25px;
        }

        @media (display-mode: standalone) {
            .container { padding-top: 0.8cm !important; }
        }

        header { margin-bottom: 15px; }
        
        .sub-title { 
            font-size: 0.95rem; 
            color: #ffffff; 
            margin: 0; 
            font-weight: 400; 
        }

        .city-name { 
            font-size: 2.1rem; 
            margin: 15px 0;
            color: var(--primary-color); 
            font-weight: 700; 
            cursor: pointer;
            display: block;
            line-height: 1.1;
        }

        #current-date-header {
            color: var(--text-color); font-size: 1rem; 
            margin: 0 0 15px 0; 
            cursor: pointer; min-height: 1.2em; opacity: 0.8;
        }

        .prayer-times-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex-shrink: 0; }

        .prayer-card {
            background: var(--card-color); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 15px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .prayer-card h2 { margin: 0 0 8px; font-size: 0.95rem; color: var(--primary-color); font-weight: 600; }
        .prayer-card p { margin: 0; font-size: 1.4rem; font-weight: 700; }

        .next-prayer-highlight { 
            border: 2px solid var(--primary-color) !important; 
            box-shadow: 0 0 8px rgba(225, 197, 110, 0.3) !important; 
            background: var(--card-color) !important; 
            transform: scale(1.03); 
            z-index: 5;
        }

        .countdown-card { grid-column: 1 / -1; margin-top: 8px; align-content: center; min-height: 90px; }
        
        .gold-num { color: var(--primary-color); font-weight: 800; }

        .navigation-controls { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 1rem; }

        .nav-arrow {
            background: var(--card-color); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--primary-color); border-radius: 50%; width: 60px; height: 60px;
            font-size: 1.8rem; cursor: pointer; display: flex; justify-content: center; align-items: center;
            padding-bottom: 5px; transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* تعديل تأثير النقر: تغيير الإطار فقط والحفاظ على الخلفية */
        .nav-arrow:active { 
            transform: scale(0.92); 
            border-color: var(--primary-color); 
            background: var(--card-color); /* يبقى نفس لون الكارد */
            color: var(--primary-color); /* يبقى السهم ذهبي */
        }

        .nav-arrow:disabled { opacity: 0.2; cursor: not-allowed; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: flex-start;
            padding-top: 12vh; z-index: 1000;
        }
        .modal-content {
            background: #1b263b; border: 1px solid rgba(225, 197, 110, 0.3);
            padding: 22px; border-radius: 24px; text-align: center;
            width: fit-content; min-width: 280px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .city-selection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
        .city-btn {
            background: rgba(255, 255, 255, 0.03); color: #fff; border: 1px solid rgba(225, 197, 110, 0.15);
            border-radius: 14px; padding: 12px 5px; cursor: pointer; font-family: 'Cairo';
            font-size: 0.85rem; font-weight: 600;
        }

        .date-selection-container { display: inline-flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .date-segment-input { 
            width: 65px; padding: 10px 0; border-radius: 10px; border: 1px solid rgba(225, 197, 110, 0.2); 
            background: rgba(0, 0, 0, 0.2); color: #fff; text-align: center; font-family: 'Cairo';
            direction: ltr;
            unicode-bidi: bidi-override;
        }
        #go-to-date-btn { background: var(--primary-color); color: var(--bg-color); border: none; padding: 10px 0; width: 100%; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div id="city-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 340px; width: 90%;">
            <h2 style="color:var(--primary-color);">اختر المحافظة</h2>
            <div id="city-selection" class="city-selection-grid">
                <button class="city-btn" data-city="amman" data-name="عمّان">عمّان</button>
                <button class="city-btn" data-city="zarqa" data-name="الزرقاء">الزرقاء</button>
                <button class="city-btn" data-city="balqa" data-name="البلقاء">البلقاء</button>
                <button class="city-btn" data-city="madaba" data-name="مادبا">مادبا</button>
                <button class="city-btn" data-city="irbid" data-name="إربد">إربد</button>
                <button class="city-btn" data-city="mafraq" data-name="المفرق">المفرق</button>
                <button class="city-btn" data-city="ajloun" data-name="عجلون">عجلون</button>
                <button class="city-btn" data-city="jerash" data-name="جرش">جرش</button>
                <button class="city-btn" data-city="karak" data-name="الكرك">الكرك</button>
                <button class="city-btn" data-city="tafilah" data-name="الطفيلة">الطفيلة</button>
                <button class="city-btn" data-city="ma'an" data-name="معان">معان</button>
                <button class="city-btn" data-city="aqaba" data-name="العقبة">العقبة</button>
            </div>
            <p id="close-city-modal" style="margin-top:18px; font-size:0.8rem; cursor:pointer; opacity:0.5; display:none">إغلاق</p>
        </div>
    </div>

    <div id="date-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color:var(--primary-color);">اذهب إلى تاريخ</h2>
            <div class="date-selection-container">
                <div style="display: flex; gap: 8px; direction: rtl;">
                    <input type="number" id="day-input" class="date-segment-input" placeholder="يوم">
                    <input type="number" id="month-input" class="date-segment-input" placeholder="شهر">
                    <input type="number" id="year-input" class="date-segment-input" value="2026">
                </div>
                <button id="go-to-date-btn">تأكيد الانتقال</button>
            </div>
            <p id="date-error-msg" style="color:#ff6b6b; font-size:0.75rem; margin-top:5px;"></p>
            <p onclick="document.getElementById('date-modal').style.display='none'" style="margin-top:10px; font-size:0.8rem; cursor:pointer; opacity:0.5">إلغاء</p>
        </div>
    </div>

    <div class="container">
        <header>
            <p class="sub-title">مواقيت الصلاة في</p>
            <h1 id="city-header" class="city-name">--</h1>
            <p id="current-date-header">تحميل البيانات...</p>
        </header>
        
        <div class="prayer-times-grid">
            <div class="prayer-card" id="fajr-card"><h2>الفجر</h2><p id="fajr-time">--:--</p></div>
            <div class="prayer-card" id="sunrise-card"><h2>الشروق</h2><p id="sunrise-time">--:--</p></div>
            <div class="prayer-card" id="dhuhr-card"><h2>الظهر</h2><p id="dhuhr-time">--:--</p></div>
            <div class="prayer-card" id="asr-card"><h2>العصر</h2><p id="asr-time">--:--</p></div>
            <div class="prayer-card" id="maghrib-card"><h2>المغرب</h2><p id="maghrib-time">--:--</p></div>
            <div class="prayer-card" id="isha-card"><h2>العشاء</h2><p id="isha-time">--:--</p></div>
            <div class="prayer-card countdown-card">
                <h2 id="countdown-title">الوقت المتبقي</h2>
                <p id="countdown-timer">--:--:--</p>
            </div>
        </div>

        <div class="navigation-controls">
            <button id="prev-day-btn" class="nav-arrow">&lt;</button>
            <button id="next-day-btn" class="nav-arrow">&gt;</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('SW Registered'))
                        .catch(err => console.log('SW Error', err));
                });
            }

            const cityModal = document.getElementById('city-modal');
            const dateModal = document.getElementById('date-modal');
            const dayInput = document.getElementById('day-input');
            const monthInput = document.getElementById('month-input');
            const yearInput = document.getElementById('year-input');
            const goToDateBtn = document.getElementById('go-to-date-btn');
            const dateErrorMsg = document.getElementById('date-error-msg');
            const cityHeader = document.getElementById('city-header');
            const closeCityBtn = document.getElementById('close-city-modal');
            
            let prayerData = null;
            let displayedDate = new Date();
            const prayerNames = {FAJR:'الفجر', SUNRISE:'الشروق', DHUHR:'الظهر', ASR:'العصر', MAGHRIB:'المغرب', ISHA:'العشاء'};
            let countdownInterval = null;

            const elements = {
                fajrTime: document.getElementById('fajr-time'), sunriseTime: document.getElementById('sunrise-time'),
                dhuhrTime: document.getElementById('dhuhr-time'), asrTime: document.getElementById('asr-time'),
                maghribTime: document.getElementById('maghrib-time'), ishaTime: document.getElementById('isha-time'),
                nextDayBtn: document.getElementById('next-day-btn'), prevDayBtn: document.getElementById('prev-day-btn'),
                currentDateHeader: document.getElementById('current-date-header'),
                countdownTitle: document.getElementById('countdown-title'), countdownTimer: document.getElementById('countdown-timer')
            };

            function formatAr(num, sing, dual, plur) {
                const numSpan = `<span class="gold-num">${num}</span>`;
                if (num === 1) return sing;
                if (num === 2) return dual;
                if (num >= 3 && num <= 10) return `${numSpan} ${plur}`;
                return `${numSpan} ${sing}`;
            }

            function formatCountdownText(h, m, s) {
                let hT = h > 0 ? formatAr(h, "ساعة", "ساعتان", "ساعات") : "";
                let mT = m > 0 ? formatAr(m, "دقيقة", "دقيقتان", "دقائق") : "";
                let sT = (h === 0 && m < 5) ? formatAr(s, "ثانية", "ثانيتان", "ثوانٍ") : "";
                let res = `${hT} ${h > 0 && mT != '' ? 'و' : ''} ${mT} ${mT != '' && sT != '' ? 'و' : ''} ${sT}`.trim();
                return res === "" ? "ثوانٍ معدودة" : res;
            }

            async function fetchAndParsePrayerData(cityId) {
                const url = `https://iofahmawi.github.io/salat/governorates/${cityId}-2026.csv`;
                try {
                    const response = await fetch(url);
                    const csvText = await response.text();
                    return new Map(csvText.trim().split('\n').slice(1).map(line => {
                        const [date, fajr, sunrise, dhuhr, asr, maghrib, isha] = line.split(',');
                        return [date, { FAJR: fajr, SUNRISE: sunrise, DHUHR: dhuhr, ASR: asr, MAGHRIB: maghrib, ISHA: isha }];
                    }));
                } catch (e) { return null; }
            }

            function parseTimeTo24Hour(timeStr, prayerKey) {
                let [hours, minutes] = timeStr.split(':').map(Number);
                if (['DHUHR', 'ASR', 'MAGHRIB', 'ISHA'].includes(prayerKey) && hours < 12) hours += 12;
                return { hours, minutes };
            }

            async function initializeCity(cityId, cityName) {
                cityHeader.textContent = cityName;
                prayerData = await fetchAndParsePrayerData(cityId);
                if (prayerData) { 
                    displayedDate = new Date(); 
                    updateUIForDate(displayedDate); 
                    closeCityBtn.style.display = 'block';
                }
            }

            function updateUIForDate(date) {
                if (!prayerData) return;
                const dateKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                const dayData = prayerData.get(dateKey);
                if(!dayData) return;

                elements.currentDateHeader.textContent = date.toLocaleDateString('ar-EG-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

                ['FAJR', 'SUNRISE', 'DHUHR', 'ASR', 'MAGHRIB', 'ISHA'].forEach(key => {
                    const timeStr = dayData[key];
                    if (timeStr) {
                        const { hours, minutes } = parseTimeTo24Hour(timeStr, key);
                        elements[`${key.toLowerCase()}Time`].textContent = `${hours % 12 || 12}:${String(minutes).padStart(2, '0')} ${(key === 'FAJR' || key === 'SUNRISE') ? 'ص' : 'م'}`;
                    }
                });
                startCountdown(date);
                updateNavigation(date);
            }

            function startCountdown(date) {
                if (countdownInterval) clearInterval(countdownInterval);
                const isToday = date.toDateString() === new Date().toDateString();

                if (!isToday) {
                    elements.countdownTitle.textContent = "الوقت المتبقي";
                    elements.countdownTimer.textContent = "غير متوفر";
                    document.querySelectorAll('.prayer-card').forEach(c => c.classList.remove('next-prayer-highlight'));
                    return;
                }

                countdownInterval = setInterval(() => {
                    const now = new Date();
                    const dateKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                    const dayData = prayerData.get(dateKey);
                    if(!dayData) return;
                    
                    document.querySelectorAll('.prayer-card').forEach(c => c.classList.remove('next-prayer-highlight'));

                    const fajrInfo = parseTimeTo24Hour(dayData['FAJR'], 'FAJR');
                    const fajrTime = new Date(date.getFullYear(), date.getMonth(), date.getDate(), fajrInfo.hours, fajrInfo.minutes);
                    const imsakTime = new Date(fajrTime.getTime() - (15 * 60000));

                    if (now < imsakTime && now.getHours() < 12) {
                        const diffImsak = imsakTime - now;
                        const h = Math.floor(diffImsak / 3600000), m = Math.floor((diffImsak % 3600000) / 60000), s = Math.floor((diffImsak % 60000) / 1000);
                        elements.countdownTitle.innerHTML = `<span style="color:var(--primary-color)">متبقي على الإمساك</span>`;
                        elements.countdownTimer.innerHTML = formatCountdownText(h, m, s);
                        document.getElementById(`fajr-card`).classList.add('next-prayer-highlight');
                        return;
                    }

                    let nextP = null;
                    for (const key of ['FAJR', 'DHUHR', 'ASR', 'MAGHRIB', 'ISHA']) {
                        const { hours, minutes } = parseTimeTo24Hour(dayData[key], key);
                        const pTime = new Date(date.getFullYear(), date.getMonth(), date.getDate(), hours, minutes);
                        if (pTime > now) { nextP = { name: prayerNames[key], time: pTime, key: key }; break; }
                    }

                    if (nextP) {
                        const diff = nextP.time - now;
                        const h = Math.floor(diff / 3600000), m = Math.floor((diff % 3600000) / 60000), s = Math.floor((diff % 60000) / 1000);
                        elements.countdownTitle.textContent = `متبقي على صلاة ${nextP.name}`;
                        elements.countdownTimer.innerHTML = formatCountdownText(h, m, s);
                        document.getElementById(`${nextP.key.toLowerCase()}-card`).classList.add('next-prayer-highlight');
                    } else {
                        elements.countdownTitle.textContent = "انتهت صلوات اليوم";
                        elements.countdownTimer.innerHTML = "تقبل الله طاعتكم";
                    }
                }, 1000);
            }

            function updateNavigation(date) {
                if(!prayerData) return;
                const keys = Array.from(prayerData.keys());
                const current = new Date(date); current.setHours(0,0,0,0);
                elements.prevDayBtn.disabled = current <= new Date(keys[0]);
                elements.nextDayBtn.disabled = current >= new Date(keys[keys.length-1]);
            }

            document.getElementById('city-selection').addEventListener('click', e => {
                const btn = e.target.closest('.city-btn');
                if (btn) {
                    localStorage.setItem('selectedCityId', btn.dataset.city);
                    localStorage.setItem('selectedCityName', btn.dataset.name);
                    cityModal.style.display = 'none';
                    initializeCity(btn.dataset.city, btn.dataset.name);
                }
            });

            cityHeader.addEventListener('click', () => cityModal.style.display = 'flex');
            closeCityBtn.addEventListener('click', () => cityModal.style.display = 'none');
            
            elements.nextDayBtn.addEventListener('click', () => { displayedDate.setDate(displayedDate.getDate() + 1); updateUIForDate(displayedDate); });
            elements.prevDayBtn.addEventListener('click', () => { displayedDate.setDate(displayedDate.getDate() - 1); updateUIForDate(displayedDate); });
            
            elements.currentDateHeader.addEventListener('click', () => { 
                dayInput.value = displayedDate.getDate(); 
                monthInput.value = displayedDate.getMonth() + 1; 
                dateModal.style.display = 'flex'; 
            });

            goToDateBtn.addEventListener('click', () => {
                const d = `${yearInput.value}-${String(monthInput.value).padStart(2,'0')}-${String(dayInput.value).padStart(2,'0')}`;
                if (prayerData && prayerData.has(d)) { 
                    displayedDate = new Date(d); 
                    updateUIForDate(displayedDate); 
                    dateModal.style.display = 'none'; 
                } else dateErrorMsg.textContent = "غير متوفر";
            });

            const savedId = localStorage.getItem('selectedCityId');
            if (savedId) initializeCity(savedId, localStorage.getItem('selectedCityName'));
            else cityModal.style.display = 'flex';
        });
    </script>
</body>
</html>
